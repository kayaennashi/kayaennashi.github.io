<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加弥園-kayaen- 配送依頼フォーム</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .form-container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 30px; border-bottom: 2px solid #1abc9c; padding-bottom: 10px; }
        .order-block { background: #fdfdfd; border: 2px solid #e0e0e0; border-radius: 6px; padding: 20px; margin-bottom: 20px; position: relative; }
        .order-title { margin-top: 0; color: #2c3e50; font-size: 1.2rem; font-weight: bold; padding-right: 80px; }
        .section-title { color: #1abc9c; border-left: 4px solid #1abc9c; padding-left: 10px; margin-top: 20px; margin-bottom: 15px; font-size: 1.05rem; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input[type="text"], input[type="tel"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        textarea { resize: vertical; }
        input:focus:not([readonly]), select:focus, textarea:focus { border-color: #1abc9c; outline: none; background-color: #f9fdfc; }
        input[readonly] { background-color: #e9ecef; color: #6c757d; cursor: not-allowed; border: 1px solid #ddd; }
        input[readonly]:focus { outline: none; }
        .same-sender-area, .home-delivery-area { background-color: #e8f8f5; padding: 12px; border-radius: 4px; margin-bottom: 15px; }
        .same-sender-area label, .home-delivery-area label { display: inline-block; margin: 0; cursor: pointer; color: #16a085; }
        .add-btn { display: block; width: 100%; padding: 12px; background-color: #fff; color: #1abc9c; border: 2px solid #1abc9c; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 20px; transition: background 0.2s; }
        .add-btn:hover { background-color: #f0fbf9; }
        .submit-btn { display: block; width: 100%; padding: 15px; background-color: #1abc9c; color: white; border: none; border-radius: 4px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .submit-btn:hover { background-color: #16a085; }
        .add-item-btn { width: 100%; padding: 10px; margin-bottom: 5px; background-color: #fff; color: #1abc9c; border: 2px dashed #1abc9c; border-radius: 4px; font-size: 0.95rem; cursor: pointer; }
        .add-item-btn:hover { background-color: #f0fbf9; }
        .remove-order-btn, .remove-item-btn { position: absolute; top: 15px; right: 15px; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .remove-order-btn { background: #c0392b; padding: 6px 12px; font-size: 0.85rem; }
        .remove-order-btn:hover { background: #e74c3c; }
        .remove-item-btn { background: #e74c3c; padding: 5px 10px; font-size: 0.8rem; }
        .item-block { border: 1px dashed #1abc9c; padding: 15px; margin-bottom: 15px; border-radius: 4px; position: relative; background-color: #fafdfc; }
        .shipping-notice { font-size: 0.85rem; color: #e74c3c; text-align: center; margin-bottom: 20px; }
        .info-message { display: none; color: #e74c3c; margin-top: 15px; font-weight: bold; text-align: center; font-size: 0.9rem; line-height: 1.4; }
        .item-desc { font-size: 0.85rem; color: #d35400; margin-top: 5px; font-weight: bold; min-height: 1.2em; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>加弥園 配送依頼フォーム</h2>
    <form id="deliveryForm">
        <div id="orders-container"></div>
        <button type="button" id="addOrderBtn" class="add-btn">＋ お届け先を追加する</button>
        
        <div class="form-group" style="margin-top: 25px;">
            <label>その他ご要望など</label>
            <textarea id="formNotes" rows="4" placeholder="例：ご不在期間、ご不明な点など"></textarea>
        </div>
        
        <button type="submit" class="submit-btn">メールを作成する</button>
        
        <div id="statusMessage" class="info-message">
            ※メールソフトが自動で起動しない場合は、<br>お使いの端末のメール設定（デフォルトのメールアプリ）をご確認ください。
        </div>
    </form>
</div>

<template id="item-template">
    <div class="item-block">
        <button type="button" class="remove-item-btn">削除</button>
        <div class="form-group item-category-group">
            <label>種類</label>
            <select class="item-category" required>
                <option value="" disabled selected>選択してください</option>
            </select>
        </div>
        <div class="form-group item-variety-group" style="display: none;">
            <label>品種</label>
            <select class="item-variety" required>
                <option value="" disabled selected>種類を先に選択してください</option>
            </select>
        </div>
        <div class="form-group item-size-group" style="display: none;">
            <label>箱サイズ</label>
            <select class="item-size" required>
                <option value="" disabled selected>品種を先に選択してください</option>
            </select>
            <div class="item-desc"></div>
        </div>
        <div class="form-group item-quantity-group" style="display: none;">
            <label>箱数</label>
            <input type="number" class="item-quantity" min="1" value="1" required>
        </div>
    </div>
</template>

<template id="order-template">
    <div class="order-block">
        <button type="button" class="remove-order-btn">このお届け先を削除</button>
        <div class="order-title"></div>
        
        <div class="same-sender-area" style="display:none;">
            <label><input type="checkbox" class="same-sender-check">【1件目とご依頼主が同じ場合】</label>
        </div>
        
        <div class="section-title">▼ 注文の品</div>
        <div class="items-container"></div>
        <button type="button" class="add-item-btn">＋ 別の品種・箱サイズを追加する</button>
        <div class="shipping-notice">※別の品種・箱サイズを追加する場合、送料が別に掛かる場合がございます。</div>
        
        <div class="section-title">▼ 送り先</div>
        <div class="form-group">
            <label>郵便番号（ハイフンなし）</label>
            <input type="text" class="to-zip" placeholder="例：1234567" maxlength="8" required>
        </div>
        <div class="form-group">
            <label>住所</label>
            <input type="text" class="to-addr-auto" placeholder="郵便番号から自動入力されます" readonly tabindex="-1">
        </div>
        <div class="form-group">
            <label>番地・建物名など</label>
            <input type="text" class="to-addr-detail" placeholder="例：1-2-3 メゾン稲城101" required>
        </div>
        <div class="form-group">
            <label>お名前</label>
            <input type="text" class="to-name" placeholder="例：稲城 梨太郎" required>
        </div>
        <div class="form-group">
            <label>電話番号（ハイフンなし）</label>
            <input type="tel" class="to-tel" placeholder="例：09000001234" required>
        </div>
        
        <div class="sender-section">
            <div class="section-title">▼ ご依頼主</div>
            <div class="home-delivery-area">
                <label><input type="checkbox" class="home-delivery-check">【ご自宅への配送の場合】</label>
            </div>
            <div class="sender-inputs">
                <div class="form-group">
                    <label>郵便番号（ハイフンなし）</label>
                    <input type="text" class="from-zip" placeholder="例：9876543" maxlength="8" required>
                </div>
                <div class="form-group">
                    <label>住所</label>
                    <input type="text" class="from-addr-auto" placeholder="郵便番号から自動入力されます" readonly tabindex="-1">
                </div>
                <div class="form-group">
                    <label>番地・建物名など</label>
                    <input type="text" class="from-addr-detail" placeholder="例：2125-3" required>
                </div>
                <div class="form-group">
                    <label>お名前</label>
                    <input type="text" class="from-name" placeholder="例：稲城梨之助" required>
                </div>
                <div class="form-group">
                    <label>電話番号（ハイフンなし）</label>
                    <input type="tel" class="from-tel" placeholder="例：0600006789" required>
                </div>
            </div>
        </div>
    </div>
</template>

<script>
const categoryData = { 
    "梨": ["幸水", "豊水", "あきづき", "稲城", "新高"], 
    "ぶどう": ["高尾ぶどう", "シャインマスカット", "富士の輝"] 
};

const itemData = { 
    "幸水": ["平箱", "二段箱"], "豊水": ["平箱", "二段箱"], "あきづき": ["平箱", "二段箱"], 
    "稲城": ["平箱", "二段箱", "3kg箱", "特4kg箱"], "新高": ["平箱", "二段箱", "3kg箱", "特4kg箱"], 
    "高尾ぶどう": ["2kg箱", "3kg箱"], "シャインマスカット": ["1kg箱", "2kg箱"], "富士の輝": ["1kg箱", "2kg箱"]
};

const itemDescData = {
    "幸水:平箱": "11玉", "幸水:二段箱": "22玉", "あきづき:平箱": "11玉", "あきづき:二段箱": "22玉",
    "稲城:平箱": "9玉", "稲城:二段箱": "18玉", "稲城:3kg箱": "中玉5玉", "稲城:特4kg箱": "大玉6玉",
    "豊水:平箱": "9玉", "豊水:二段箱": "18玉",
    "新高:平箱": "8玉", "新高:二段箱": "16玉", "新高:3kg箱": "中玉4玉", "新高:特4kg箱": "大玉5玉",
    "高尾ぶどう:2kg箱": "3, 4房（大きさによる）", "高尾ぶどう:3kg箱": "4, 5房（大きさによる）"
};

const stoppedItems = ["梨"];

const q = (el, sel) => el.querySelector(sel);
const qa = (el, sel) => el.querySelectorAll(sel);
const createOpt = (val, stopKey = val) => {
    const isStop = stoppedItems.includes(stopKey);
    return `<option value="${val}" ${isStop ? 'disabled' : ''}>${val}${isStop ? '（受付停止中）' : ''}</option>`;
};

const itemTpl = document.getElementById('item-template');
const orderTpl = document.getElementById('order-template');
const container = document.getElementById('orders-container');

const catSel = q(itemTpl.content, '.item-category');
Object.keys(categoryData).forEach(c => catSel.insertAdjacentHTML('beforeend', createOpt(c)));

const updateOrders = () => {
    qa(container, '.order-block').forEach((block, i) => {
        const isFirst = i === 0;
        q(block, '.order-title').textContent = `【${i + 1}件目】`;
        
        const sameArea = q(block, '.same-sender-area');
        if (sameArea) sameArea.style.display = isFirst ? 'none' : 'block';
        
        const rmBtn = q(block, '.remove-order-btn');
        if (rmBtn) rmBtn.style.display = isFirst ? 'none' : 'block';
    });
};

const addOrder = () => {
    const clone = orderTpl.content.cloneNode(true);
    const items = q(clone, '.items-container');
    items.appendChild(itemTpl.content.cloneNode(true));
    q(items, '.remove-item-btn').style.display = 'none';
    
    container.appendChild(clone);
    updateOrders();
};

addOrder();
document.getElementById('addOrderBtn').addEventListener('click', addOrder);

container.addEventListener('input', async e => {
    const t = e.target;
    const c = t.classList;
    
    if (c.contains('to-zip') || c.contains('from-zip')) {
        t.value = t.value.replace(/-/g, '');
        if (t.value.length === 7) {
            try {
                const res = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${t.value}`);
                const data = await res.json();
                if (data.status === 200 && data.results) {
                    const r = data.results[0];
                    const target = q(t.closest('.order-block'), c.contains('to-zip') ? '.to-addr-auto' : '.from-addr-auto');
                    target.value = `${r.address1}${r.address2}${r.address3}`;
                }
            } catch (err) {
                console.error(err);
            }
        }
    }
    
    if (c.contains('to-tel') || c.contains('from-tel')) {
        t.value = t.value.replace(/-/g, '');
    }
});

const fmtTel = (tel) => {
    const v = tel.replace(/-/g, '');
    if (v.length === 11) return v.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
    if (v.length === 10) return v.replace(v.match(/^(03|06)/) ? /(\d{2})(\d{4})(\d{4})/ : /(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
    return tel;
};

container.addEventListener('change', e => {
    const t = e.target;
    const c = t.classList;
    const block = t.closest('.order-block');
    const item = t.closest('.item-block');
    
    if (c.contains('item-category')) {
        const varSel = q(item, '.item-variety');
        varSel.innerHTML = '<option value="" disabled selected>選択してください</option>';
        (categoryData[t.value] || []).forEach(v => varSel.insertAdjacentHTML('beforeend', createOpt(v)));
        
        q(item, '.item-variety-group').style.display = 'block';
        q(item, '.item-size-group').style.display = 'none';
        q(item, '.item-quantity-group').style.display = 'none';
        q(item, '.item-size').innerHTML = '<option value="" disabled selected>品種を先に選択してください</option>';
        q(item, '.item-desc').textContent = '';
    }
    else if (c.contains('item-variety')) {
        const sizeSel = q(item, '.item-size');
        sizeSel.innerHTML = '<option value="" disabled selected>選択してください</option>';
        (itemData[t.value] || []).forEach(s => sizeSel.insertAdjacentHTML('beforeend', createOpt(s, `${t.value}:${s}`)));
        
        q(item, '.item-size-group').style.display = 'block';
        q(item, '.item-quantity-group').style.display = 'none';
        q(item, '.item-desc').textContent = '';
    }
    else if (c.contains('item-size')) {
        const varVal = q(item, '.item-variety').value;
        const desc = itemDescData[`${varVal}:${t.value}`];
        q(item, '.item-desc').textContent = desc ? `※目安：${desc}` : '';
        q(item, '.item-quantity-group').style.display = 'block';
    }
    else if (c.contains('home-delivery-check')) {
        const inputs = q(block, '.sender-inputs');
        inputs.style.display = t.checked ? 'none' : 'block';
        qa(inputs, 'input').forEach(i => i.required = !t.checked);
    }
    else if (c.contains('same-sender-check')) {
        const sec = q(block, '.sender-section');
        const homeChk = q(block, '.home-delivery-check').checked;
        sec.style.display = t.checked ? 'none' : 'block';
        qa(sec, 'input[type="text"], input[type="tel"]').forEach(i => i.required = (!t.checked && !homeChk));
    }
});

container.addEventListener('click', e => {
    const t = e.target;
    const c = t.classList;
    
    if (c.contains('add-item-btn')) {
        const items = q(t.closest('.order-block'), '.items-container');
        items.appendChild(itemTpl.content.cloneNode(true));
        qa(items, '.remove-item-btn').forEach(btn => btn.style.display = 'block');
    }
    else if (c.contains('remove-item-btn')) {
        const items = t.closest('.items-container');
        t.closest('.item-block').remove();
        if (items.children.length === 1) q(items, '.remove-item-btn').style.display = 'none';
    }
    else if (c.contains('remove-order-btn')) {
        t.closest('.order-block').remove();
        updateOrders();
    }
});

document.getElementById('deliveryForm').addEventListener('submit', e => {
    e.preventDefault();
    const mailBody = [];
    let fSender = {};

    qa(document, '.order-block').forEach((block, i) => {
        const v = sel => q(block, sel).value;
        const toZip = v('.to-zip'), toAddr = `${v('.to-addr-auto')}${v('.to-addr-detail')}`, toName = v('.to-name'), toTel = fmtTel(v('.to-tel'));
        
        const itemsText = Array.from(qa(block, '.item-block')).map((item, j) => 
            ` ［品物${j + 1}］\r\n  品種：${q(item, '.item-variety').value}\r\n  箱サイズ：${q(item, '.item-size').value}\r\n  箱数：${q(item, '.item-quantity').value}箱`
        ).join('\r\n');

        const isSame = q(block, '.same-sender-check')?.checked;
        const isHome = q(block, '.home-delivery-check').checked;
        
        if (i === 0) {
            fSender = isHome ? { z: toZip, a: toAddr, n: toName, t: toTel } 
                             : { z: v('.from-zip'), a: `${v('.from-addr-auto')}${v('.from-addr-detail')}`, n: v('.from-name'), t: fmtTel(v('.from-tel')) };
        }

        let sText = isSame ? ` 郵便番号：${fSender.z}\r\n 住所：${fSender.a}\r\n お名前：${fSender.n}\r\n ご連絡先：${fSender.t}`
                  : isHome ? ` ご本人`
                  : ` 郵便番号：${v('.from-zip')}\r\n 住所：${v('.from-addr-auto')}${v('.from-addr-detail')}\r\n お名前：${v('.from-name')}\r\n ご連絡先：${fmtTel(v('.from-tel'))}`;

        mailBody.push(`【${i + 1}件目】\r\n▼ 注文の品\r\n${itemsText}\r\n\r\n▼ 送り先\r\n 郵便番号：${toZip}\r\n 住所：${toAddr}\r\n お名前：${toName}\r\n ご連絡先：${toTel}\r\n\r\n▼ ご依頼主\r\n${sText}\r\n\r\n--------------------------------------`);
    });

    const notes = document.getElementById('formNotes').value;
    if (notes) mailBody.push(`▼ その他ご要望など\r\n${notes}\r\n\r\n--------------------------------------`);

    window.location.href = `mailto:kayaen.nashi@gmail.com?subject=${encodeURIComponent("配送のご注文")}&body=${encodeURIComponent(mailBody.join('\r\n\r\n'))}`;
    document.getElementById('statusMessage').style.display = 'block';
});
</script>

</body>
</html>
